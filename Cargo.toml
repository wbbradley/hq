[workspace]
resolver = "3"
members = [
  "crates/hq-application",
  "crates/hq-codex",
  "crates/hq-domain",
  "crates/hq-harness",
  "crates/hq-local-api",
  "crates/hq-node",
  "crates/hq-protocol",
  "crates/hq-reducer",
  "crates/hq-relay",
  "crates/hq-store",
  "crates/hq-testkit",
  "crates/hq-tui",
]
default-members = ["crates/hq-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/wbbradley/hq"
publish = false

[workspace.dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bech32 = { version = "0.12.0", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.10.1", default-features = false, features = ["cipher", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4.3", default-features = false }
hq-application = { version = "0.1.0", path = "crates/hq-application" }
hq-codex = { version = "0.1.0", path = "crates/hq-codex" }
hq-domain = { version = "0.1.0", path = "crates/hq-domain" }
hq-harness = { version = "0.1.0", path = "crates/hq-harness" }
hq-local-api = { version = "0.1.0", path = "crates/hq-local-api" }
hq-protocol = { version = "0.1.0", path = "crates/hq-protocol" }
hq-reducer = { version = "0.1.0", path = "crates/hq-reducer" }
hq-relay = { version = "0.1.0", path = "crates/hq-relay" }
hq-store = { version = "0.1.0", path = "crates/hq-store" }
hq-testkit = { version = "0.1.0", path = "crates/hq-testkit" }
hq-tui = { version = "0.1.0", path = "crates/hq-tui" }
hmac = { version = "0.13.0", default-features = false }
k256 = { version = "0.14.0", default-features = false, features = ["ecdh", "schnorr"] }
nix = { version = "0.31.3", default-features = false, features = ["fs", "socket", "user"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["raw_value", "std"] }
sha2 = { version = "0.11.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
unicode-normalization = { version = "0.1.25", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
struct_field_names = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
