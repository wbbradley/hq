name: Rust release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare native release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Generate matrix from the acceptance contract
        id: targets
        run: |
          targets=$(scripts/rust-qualification-matrix-json.sh)
          jq -e '.include | length == 4' <<<"$targets" >/dev/null
          printf 'targets=%s\n' "$targets" >>"$GITHUB_OUTPUT"

  package:
    name: Native release artifact (${{ matrix.rust_host }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Verify native Rust host
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          actual_rust_host=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual_rust_host" = "$EXPECTED_RUST_HOST"
      - name: Build revision-stamped release executable
        env:
          HQ_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hq-node --bin hq
      - name: Package and verify installed lifecycle
        env:
          RUST_HOST: ${{ matrix.rust_host }}
        run: |
          artifact_directory="$RUNNER_TEMP/hq-rust-release"
          mkdir -p "$artifact_directory"
          scripts/package-rust-release.sh \
            "$PWD/target/release/hq" "$artifact_directory" "${{ github.sha }}" "$RUST_HOST"
          scripts/verify-rust-release-artifact.sh \
            "$artifact_directory" "${{ github.sha }}" "$RUST_HOST"
      - name: Rehearse isolated identity and database recovery
        env:
          RUST_HOST: ${{ matrix.rust_host }}
        run: |
          scripts/rehearse-rust-recovery.sh \
            "$PWD/target/release/hq" \
            "$RUNNER_TEMP/hq-rust-release/hq-recovery-$RUST_HOST.json" \
            "${{ github.sha }}" "$RUST_HOST"
      - name: Upload native release artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-${{ matrix.rust_host }}
          path: ${{ runner.temp }}/hq-rust-release
          if-no-files-found: error
          retention-days: 30

  controlled-failure:
    name: Controlled relay and provider failure
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Download Linux x86_64 release artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-release-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/hq-rust-controlled-failure
      - name: Extract verified release candidate
        run: |
          artifact_directory="$RUNNER_TEMP/hq-rust-controlled-failure"
          archives=("$artifact_directory"/hq-v*-x86_64-unknown-linux-gnu.tar.gz)
          test "${#archives[@]}" = 1
          cd "$artifact_directory"
          sha256sum --check "$(basename "${archives[0]}").sha256"
          mkdir installed
          tar -xzf "${archives[0]}" -C installed
      - name: Rehearse controlled relay and provider failure
        run: |
          scripts/rehearse-rust-controlled-failure.sh \
            "$RUNNER_TEMP/hq-rust-controlled-failure/installed/hq" \
            "$RUNNER_TEMP/hq-rust-controlled-failure/controlled-failure.json" \
            "${{ github.sha }}"
      - name: Upload controlled-failure evidence
        uses: actions/upload-artifact@v7
        with:
          name: rust-controlled-failure-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-controlled-failure/controlled-failure.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Verify native release matrix
    needs: [package, controlled-failure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test release artifact validator
        run: |
          scripts/test-rust-release-artifacts.sh
          scripts/test-rust-recovery-rehearsal.sh
          scripts/test-rust-controlled-failure.sh
      - name: Download native release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/hq-rust-release-matrix
          merge-multiple: true
      - name: Download controlled-failure evidence
        uses: actions/download-artifact@v8
        with:
          name: rust-controlled-failure-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-release-matrix
      - name: Verify complete release matrix
        run: |
          scripts/verify-rust-release-matrix.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix" "${{ github.sha }}" \
            "$RUNNER_TEMP/hq-rust-release-matrix/release-manifest.json"
          scripts/verify-rust-recovery-matrix.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix" "${{ github.sha }}" \
            "$RUNNER_TEMP/hq-rust-release-matrix/recovery-manifest.json"
          scripts/verify-rust-controlled-failure.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix/controlled-failure.json" \
            "${{ github.sha }}"
          jq . "$RUNNER_TEMP/hq-rust-release-matrix/release-manifest.json" \
            >>"$GITHUB_STEP_SUMMARY"
          jq . "$RUNNER_TEMP/hq-rust-release-matrix/recovery-manifest.json" \
            >>"$GITHUB_STEP_SUMMARY"
          jq . "$RUNNER_TEMP/hq-rust-release-matrix/controlled-failure.json" \
            >>"$GITHUB_STEP_SUMMARY"
      - name: Upload combined release-candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-release-matrix
          if-no-files-found: error
          retention-days: 30
