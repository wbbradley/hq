name: Rust GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: v-prefixed release tag matching the workspace version
        required: true
        default: v0.1.0
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: rust-github-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare native release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "hq-node") | .version')
          test "$RELEASE_TAG" = "v$version"
      - name: Generate matrix from the acceptance contract
        id: targets
        run: |
          targets=$(scripts/rust-qualification-matrix-json.sh)
          jq -e '.include | length == 4' <<<"$targets" >/dev/null
          printf 'targets=%s\n' "$targets" >>"$GITHUB_OUTPUT"

  package:
    name: Native release artifact (${{ matrix.rust_host }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Verify native Rust host
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          actual_rust_host=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual_rust_host" = "$EXPECTED_RUST_HOST"
      - name: Build revision-stamped release executable
        env:
          HQ_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p hq-node --bin hq
      - name: Package and verify installed lifecycle
        env:
          RUST_HOST: ${{ matrix.rust_host }}
        run: |
          artifact_directory="$RUNNER_TEMP/hq-rust-release"
          mkdir -p "$artifact_directory"
          scripts/package-rust-release.sh \
            "$PWD/target/release/hq" "$artifact_directory" "${{ github.sha }}" "$RUST_HOST"
          scripts/verify-rust-release-artifact.sh \
            "$artifact_directory" "${{ github.sha }}" "$RUST_HOST"
      - name: Rehearse isolated identity and database recovery
        env:
          RUST_HOST: ${{ matrix.rust_host }}
        run: |
          scripts/rehearse-rust-recovery.sh \
            "$PWD/target/release/hq" \
            "$RUNNER_TEMP/hq-rust-release/hq-recovery-$RUST_HOST.json" \
            "${{ github.sha }}" "$RUST_HOST"
      - name: Upload native release artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-${{ matrix.rust_host }}
          path: ${{ runner.temp }}/hq-rust-release
          if-no-files-found: error
          retention-days: 30

  controlled-failure:
    name: Controlled relay and provider failure
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Download Linux x86_64 release artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-release-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/hq-rust-controlled-failure
      - name: Extract verified release build
        run: |
          artifact_directory="$RUNNER_TEMP/hq-rust-controlled-failure"
          archives=("$artifact_directory"/hq-v*-x86_64-unknown-linux-gnu.tar.gz)
          test "${#archives[@]}" = 1
          cd "$artifact_directory"
          sha256sum --check "$(basename "${archives[0]}").sha256"
          mkdir installed
          tar -xzf "${archives[0]}" -C installed
      - name: Rehearse controlled relay and provider failure
        run: |
          scripts/rehearse-rust-controlled-failure.sh \
            "$RUNNER_TEMP/hq-rust-controlled-failure/installed/hq" \
            "$RUNNER_TEMP/hq-rust-controlled-failure/controlled-failure.json" \
            "${{ github.sha }}"
      - name: Upload controlled-failure evidence
        uses: actions/upload-artifact@v7
        with:
          name: rust-controlled-failure-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-controlled-failure/controlled-failure.json
          if-no-files-found: error
          retention-days: 30

  cutover-rollback:
    name: Synthetic archived-Go rollback
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Download Linux x86_64 release artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-release-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/hq-rust-cutover-rollback
      - name: Extract verified release build
        run: |
          artifact_directory="$RUNNER_TEMP/hq-rust-cutover-rollback"
          archives=("$artifact_directory"/hq-v*-x86_64-unknown-linux-gnu.tar.gz)
          test "${#archives[@]}" = 1
          cd "$artifact_directory"
          sha256sum --check "$(basename "${archives[0]}").sha256"
          mkdir installed
          tar -xzf "${archives[0]}" -C installed
      - name: Rehearse offline rollback selection
        run: |
          scripts/rehearse-rust-cutover-rollback.sh \
            "$RUNNER_TEMP/hq-rust-cutover-rollback/installed/hq" \
            "$RUNNER_TEMP/hq-rust-cutover-rollback/cutover-rollback.json" \
            "${{ github.sha }}"
      - name: Upload cutover rollback evidence
        uses: actions/upload-artifact@v7
        with:
          name: rust-cutover-rollback-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-cutover-rollback/cutover-rollback.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Verify native release matrix
    needs: [package, controlled-failure, cutover-rollback]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Test release artifact validator
        run: |
          scripts/test-rust-go-independence.sh
          scripts/verify-rust-go-independence.sh
          scripts/test-rust-release-artifacts.sh
          scripts/test-rust-release-publication.sh
          scripts/test-rust-recovery-rehearsal.sh
          scripts/test-rust-controlled-failure.sh
          scripts/test-rust-cutover-rollback.sh
          scripts/test-rust-cutover-evidence.sh
      - name: Download native release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/hq-rust-release-matrix
          merge-multiple: true
      - name: Download controlled-failure evidence
        uses: actions/download-artifact@v8
        with:
          name: rust-controlled-failure-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-release-matrix
      - name: Download cutover rollback evidence
        uses: actions/download-artifact@v8
        with:
          name: rust-cutover-rollback-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-release-matrix
      - name: Verify complete release matrix
        run: |
          scripts/verify-rust-release-matrix.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix" "${{ github.sha }}" \
            "$RUNNER_TEMP/hq-rust-release-matrix/release-manifest.json"
          scripts/verify-rust-recovery-matrix.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix" "${{ github.sha }}" \
            "$RUNNER_TEMP/hq-rust-release-matrix/recovery-manifest.json"
          scripts/verify-rust-controlled-failure.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix/controlled-failure.json" \
            "${{ github.sha }}"
          scripts/verify-rust-cutover-rollback.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix/cutover-rollback.json" \
            "${{ github.sha }}"
          scripts/generate-rust-cutover-evidence.sh \
            "$RUNNER_TEMP/hq-rust-release-matrix" "${{ github.sha }}" \
            "$RUNNER_TEMP/hq-rust-release-matrix/cutover-evidence.json"
          {
            jq . "$RUNNER_TEMP/hq-rust-release-matrix/release-manifest.json"
            jq . "$RUNNER_TEMP/hq-rust-release-matrix/recovery-manifest.json"
            jq . "$RUNNER_TEMP/hq-rust-release-matrix/controlled-failure.json"
            jq . "$RUNNER_TEMP/hq-rust-release-matrix/cutover-rollback.json"
            jq . "$RUNNER_TEMP/hq-rust-release-matrix/cutover-evidence.json"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload combined release bundle
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-release-matrix
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: rust-release-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/hq-rust-release-bundle
      - name: Revalidate and select release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          scripts/prepare-rust-release-publication.sh \
            "$RUNNER_TEMP/hq-rust-release-bundle" "${{ github.sha }}" "$RELEASE_TAG" \
            "$RUNNER_TEMP/hq-rust-release-publication"
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'tag already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'GitHub release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Create GitHub release and exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          assets=("$RUNNER_TEMP/hq-rust-release-publication"/*)
          release_flags=(
            --repo "$GITHUB_REPOSITORY"
            --target "${{ github.sha }}"
            --title "$RELEASE_TAG"
            --generate-notes
            --fail-on-no-commits
          )
          if [[ "$PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${release_flags[@]}"
      - name: Verify published release
        env:
          EXPECTED_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          # shellcheck disable=SC2016
          jq -e --arg revision "${{ github.sha }}" \
            '.object.type == "commit" and .object.sha == $revision' \
            <<<"$tag_ref" >/dev/null
          release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url)
          # shellcheck disable=SC2016
          jq -e --arg tag "$RELEASE_TAG" --argjson prerelease "$EXPECTED_PRERELEASE" '
            .tagName == $tag and .isDraft == false and .isPrerelease == $prerelease
          ' <<<"$release" >/dev/null
          release_url=$(jq -er '.url' <<<"$release")
          printf "Published [%s](%s) at %s.\n" \
            "$RELEASE_TAG" "$release_url" "${{ github.sha }}" >>"$GITHUB_STEP_SUMMARY"
