name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/hq

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: go test -race -timeout=25m ./...

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Fetch frozen behavior reference
        run: git fetch --no-tags --depth=1 origin a2684b21de1d11c2fa0aad2ea3fd83b6c836fe82
      - name: Verify behavior and causal contracts
        run: |
          scripts/verify-rust-behavior-ledger.sh
          scripts/verify-rust-causal-spec.sh
          scripts/verify-rust-protocol-spec.sh
      - name: Verify crate architecture
        run: scripts/verify-rust-architecture.sh
      - name: Verify Rust normal-operation independence
        run: scripts/verify-rust-go-independence.sh
      - name: Test shell contracts
        run: |
          for test_script in scripts/test-*.sh; do
            "$test_script"
          done
      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        if: matrix.os == 'macos-latest'
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Test documentation
        if: matrix.os == 'macos-latest'
        run: cargo test --locked --workspace --doc --all-features
      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features

  rust-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - name: Enumerate every workspace package
        id: packages
        run: |
          packages=$(cargo metadata --locked --no-deps --format-version 1 | jq -c '[.workspace_members[] as $id | .packages[] | select(.id == $id) | .name]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  rust-linux-tests:
    needs: rust-test-matrix
    name: Rust Linux tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.rust-test-matrix.outputs.packages) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Test owning group
        run: >-
          cargo test --locked -p ${{ matrix.package }} --all-targets --all-features

      - name: Test documentation
        run: cargo test --locked -p ${{ matrix.package }} --doc --all-features

  rust-core-targets:
    name: Rust portable crates (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 "${{ matrix.target }}"
      - name: Check portable core, protocol, harness, resource, and Codex adapters
        run: >-
          cargo check --locked -p hq-domain -p hq-reducer -p hq-protocol -p hq-application
          -p hq-local-api -p hq-harness -p hq-testkit -p hq-resources -p hq-codex
          -p hq-projects
          --target "${{ matrix.target }}"

  rust-qualification:
    uses: ./.github/workflows/rust-qualification.yml

  rust-protocol-fuzz:
    name: Rust protocol fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-08-26 --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.12.0
      - name: Fuzz signed-event boundary
        run: scripts/verify-rust-protocol-fuzz.sh

  rust-dependencies:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Audit dependencies
        run: scripts/verify-rust-dependencies.sh
