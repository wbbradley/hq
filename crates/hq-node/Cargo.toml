[package]
name = "hq-node"
description = "HQ composition root and single executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bech32.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
crossterm.workspace = true
getrandom.workspace = true
hq-application.workspace = true
hq-codex.workspace = true
hq-domain.workspace = true
hq-harness.workspace = true
hq-local-api.workspace = true
hq-protocol.workspace = true
hq-projects.workspace = true
hq-relay.workspace = true
hq-reducer.workspace = true
hq-resources.workspace = true
hq-store.workspace = true
hq-tui.workspace = true
ratatui = { workspace = true, features = ["crossterm_0_29"] }
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix.workspace = true
tokio.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
nix = { workspace = true, features = ["term"] }

[[bin]]
name = "hq"
path = "src/bin/hq.rs"

[lints]
workspace = true
