version: 2

builds:
  - id: hq
    main: ./cmd/hq
    binary: hq
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/wbbradley/hq/internal/buildinfo.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
